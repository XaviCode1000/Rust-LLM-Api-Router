# =============================================================================
# Security Workflow - Dependency Review + CodeQL
# =============================================================================
# Run on:
# - Pull requests to main
# - Weekly schedule (every Monday at 8am)
# =============================================================================

name: Security

on:
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  schedule:
    - cron: "0 8 * * 1"  # Weekly Monday 8am
  workflow_dispatch:

# Least privilege
permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ============================================================================
  # 1. Dependency Review - GitHub's native dependency analysis
  # ============================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on known vulnerabilities
          fail-on-severity: high
          # Show vulnerability details
          show-opened-issues: true

  # ============================================================================
  # 2. CodeQL - Static analysis for Rust
  # ============================================================================
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Don't run on schedule - CodeQL is heavy
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          # Don't use default queries - use security-extended
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
          upload: true

  # ============================================================================
  # 3. Cargo Audit - Rust Advisory Database
  # ============================================================================
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo-audit
        run: cargo audit --db /tmp/advisory-db
        env:
          # Don't fail on unfixed vulnerabilities
          RUSTSEC_WITHOUT: ""

      - name: Upload security events
        if: failure()
        uses: github/codeql-action/upload-security-results@v4
        with:
          category: cargo-audit