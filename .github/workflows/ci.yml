# =============================================================================
# Rust-LLM-Api-Router CI - Best Practices 2026
# =============================================================================
# Principles:
# 1. Fail FAST - lint before test
# 2. Parallel Jobs - independent jobs run simultaneously
# 3. Optimize Cache - Swatinem/rust-cache + sccache
# 4. Security First - audit before test
# 5. Progressive Coverage - fast on PR, full on main
# =============================================================================

name: CI

# --------------------------------------------------------------------------
# Triggers
# --------------------------------------------------------------------------
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  schedule:
    - cron: "0 6 * * 1" # Weekly audit Monday 6am
  workflow_dispatch: # Manual trigger

# --------------------------------------------------------------------------
# Permissions - Least Privilege
# --------------------------------------------------------------------------
permissions:
  contents: read
  checks: write
  actions: read
  security-events: write
  pull-requests: write

# --------------------------------------------------------------------------
# Concurrency Control
# --------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# --------------------------------------------------------------------------
# Environment Variables - Optimized for CI
# --------------------------------------------------------------------------
env:
  # Rust
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0  # Disable, faster in CI
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

  # Warnings as errors
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"

  # sccache (optional, for faster builds)
  SCCACHE_GHA_ENABLED: "true"

  # Nextest
  CARGO_NEXTEST_ENABLED: "true"

# --------------------------------------------------------------------------
# Jobs
# --------------------------------------------------------------------------
jobs:
  # ============================================================================
  # 1. LINT - Fastest fail, runs first
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check docs
        run: cargo doc --locked --workspace --no-deps --document-private-items

  # ============================================================================
  # 2. SECURITY - Critical vulnerabilities block merge
  # ============================================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # Check advisories - FAIL on critical/high issues
      - name: Check advisories
        run: cargo deny check advisories

      # Check licenses - FAIL on forbidden licenses
      - name: Check licenses
        run: cargo deny check licenses

      # Check bans - FAIL on banned dependencies
      - name: Check banned
        run: cargo deny check bans

  # ============================================================================
  # 3. TEST - Core functionality
  # ============================================================================
  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Unit + Integration tests (nextest doesn't support doctests)
      - name: Run tests
        run: cargo nextest run --locked --workspace --all-features --profile ci --no-crate-type doctest

      # Store test results for flaky analysis
      - name: Upload nextest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-results-${{ matrix.target }}
          path: .nextest/ci/test-results/
          retention-days: 7

  # ============================================================================
  # 4. COVERAGE - Only on main, full analysis
  # ============================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: |
          cargo llvm-cov nextest \
            --workspace --all-features \
            --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ============================================================================
  # 5. DOCS - Only on main, verify documentation builds
  # ============================================================================
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: |
          cargo doc --locked --workspace --all-features \
            --document-private-items --no-deps

      - name: Run doctests
        run: cargo test --locked --workspace --doc

  # ============================================================================
  # 6. LIVE CONTRACT TESTS - Only on main with secrets
  # ============================================================================
  live-tests:
    name: Live Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Check for API keys
      - name: Check secrets
        id: check-secrets
        run: |
          required_secrets=("OPENAI_API_KEY" "ANTHROPIC_API_KEY" "GROQ_API_KEY")
          missing=0
          for secret in "${required_secrets[@]}"; do
            if [ -z "${!secret:-}" ]; then
              echo "::warning::Secret $secret not configured"
              missing=$((missing + 1))
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      # Run live tests if secrets available
      - name: Run live tests
        if: steps.check-secrets.outputs.missing == '0'
        env:
          LIVE_TEST: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: cargo nextest run --test live_contract_tests -- --ignored

      # Skip notice if no secrets
      - name: No secrets notice
        if: steps.check-secrets.outputs.missing != '0'
        run: echo "::notice::Live tests skipped - API keys not configured"

  # ============================================================================
  # 7. AUDIT SCHEDULE - Weekly dependency audit
  # ============================================================================
  audit-weekly:
    name: Weekly Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check advisories
        run: cargo deny check advisories --disable-transitive

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check banned
        run: cargo deny check bans

# END