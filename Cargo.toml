[package]
name = "rust-llm-api-router"
version = "0.1.0"
edition = "2021"
description = "LLM Proxy API Router with Clean Architecture in Rust"
license = "MIT"
authors = ["LLM Router Team"]
rust-version = "1.80"

[features]
default = []
completions = ["clap_complete", "clap_mangen"]
tui = []

[dependencies]
# Web
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
bytes = "1"

# Config & Secrets
config = "0.14"
envy = "0.4"
secrecy = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Metrics & Observability
prometheus = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive"] }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.2", optional = true }

# CLI - Interactive experience
owo-colors = "4"
comfy-table = "7"
inquire = "0.7"
indicatif = "0.17"
is-terminal = "0.4"

# TUI - Terminal User Interface
ratatui = "0.30"
crossterm = "0.28"

# Directories
dirs = "5.0"
fs4 = { version = "0.8", features = ["tokio"] }

# Token counting
tiktoken-rs = "0.6"

# OAuth 2.1 / PKCE
oauth2 = { version = "5.0", features = ["pkce-plain"] }
keyring = "2.0"
zeroize = { version = "1.7", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
urlencoding = "2.1"
url = { version = "2.4", features = ["serde"] }
zeroize_derive = "1.4"

# Encryption for fallback credential storage
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hostname = "0.4"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
tempfile = "3.10"
proptest = "1.4"
insta = { version = "1.46.3", features = ["json", "redactions"] }
wiremock = "0.6.5"
fs4 = "0.8"

[lib]
name = "rust_llm_api_router"
path = "src/lib.rs"

[[bin]]
name = "llm-router"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
